
<!DOCTYPE html>
<html>
<head><title>Signals</title><link rel="stylesheet" href="/static/dashboard.css"></head>
<body>
    <h1>Signals</h1>
    <h2>Generated</h2>
    {% if signals %}
    <ul>{% for s in signals %}<li>{{ s }}</li>{% endfor %}</ul>
    {% else %}<p>No signals.</p>{% endif %}
    <h2>Rejected</h2>
    {% if rejected %}
    <ul>{% for r in rejected %}<li>{{ r }}</li>{% endfor %}</ul>
    {% else %}<p>No rejections.</p>{% endif %}
    <a href="/dashboard/">Back</a>
</body>
</html>
